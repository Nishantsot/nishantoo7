<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="hs.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <h1>My Recipe App</h1>
        
        <div id="recipe-list"></div>
    
        <h2>Add a Recipe</h2>
        <form id="recipe-form">
          <input type="text" id="title" placeholder="Recipe Title" required>
          <textarea id="ingredients" placeholder="Ingredients" required></textarea>
          <textarea id="instructions" placeholder="Instructions" required></textarea>
          <button type="submit">Add Recipe</button>
        </form>
        
        <div id="recipe-detail"></div>
      </div>
    
      <script src="hs.js"></script>
    
    
</body>
</html>
